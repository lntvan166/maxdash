<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone: confirm destination</title>
<link rel="stylesheet" href="phone.css">
</head>
<body>
<!-- After a share: show what was understood, let the rider confirm. -->
<main class="screen">
  <h1>Go here?</h1>
  <div class="group">
    <div class="row has-ic" style="min-height:72px"><span class="ic" style="background:var(--accent)"><svg viewBox="0 0 18 18" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><path d="M9 17s6-5.5 6-10A6 6 0 0 0 3 7c0 4.5 6 10 6 10z"/><circle cx="9" cy="7" r="2"/></svg></span><span class="grow"><b style="font-weight:600">Ben Thanh Market</b><span class="sub">Lê Lợi, Bến Thành, District 1</span></span></div>
  </div>
  <div class="caption">Route</div>
  <div class="group">
    <div class="row"><span class="grow">Fastest<span class="sub">via 3 Tháng 2 · arrive 14:51</span></span><span class="val">15 min<span class="sub">5.1 km</span></span></div>
    <div class="row"><span class="grow">Shortest<span class="sub">via Nguyễn Trãi · arrive 14:54</span></span><span class="val">18 min<span class="sub">4.8 km</span></span></div>
  </div>
  <p class="foot">Shared from Google Maps · route by Apple Maps</p>
  <div class="spacer"></div>
  <button class="btn primary" type="button">Start</button>
  <button class="btn plain" type="button">Cancel</button>
</main>

</body>
</html>
