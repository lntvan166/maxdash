<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone: navigating</title>
<link rel="stylesheet" href="phone.css">
</head>
<body>
<!-- During a ride the phone is in a pocket; this screen is for a quick look at a stop. -->
<main class="screen">
  <h1>To Ben Thanh</h1>
  <div class="status"><span class="chip on"><i></i>Dash 4.1 fps</span><span class="chip on"><i></i>Bike</span><span class="chip on"><i></i>GPS</span></div>
  <div class="caption">On the dash now</div>
  <div class="preview"><iframe src="../dash/turn.html" title="Dash preview" tabindex="-1"></iframe></div>
  <div class="group">
    <div class="row"><span class="grow">Arrive<span class="sub">7.0 km left</span></span><span class="val" style="color:var(--text);font-weight:600">14:42</span></div>
    <div class="row"><span class="grow">Next<span class="sub">Turn left into Lê Quang Sung</span></span><span class="val">30 m</span></div>
  </div>
  <div class="spacer"></div>
  <button class="btn danger" type="button">End route</button>
</main>

</body>
</html>
